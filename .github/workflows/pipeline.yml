name: MLOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate deployment files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deployment dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/deployment/requirements.txt

      - name: Validate required files
        run: |
          test -f tourism_project/deployment/app.py
          test -f tourism_project/deployment/requirements.txt
          test -f tourism_project/deployment/Dockerfile
          test -f tourism_project/deployment/tourism_model.joblib

      - name: Validate Python syntax
        run: |
          python -m py_compile tourism_project/deployment/app.py

  deploy:
    name: Deploy to Hugging Face Space
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Hugging Face Hub
        run: pip install -U huggingface_hub

      - name: Upload deployment to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          username = os.environ["HF_USERNAME"]
          space_name = os.environ["HF_SPACE_NAME"]

          if not token or not username or not space_name:
              raise RuntimeError("HF_TOKEN, HF_USERNAME, and HF_SPACE_NAME must be configured.")

          api = HfApi(token=token)
          repo_id = f"{username}/{space_name}"

          api.upload_folder(
              folder_path="tourism_project/deployment",
              repo_id=repo_id,
              repo_type="space",
              commit_message="Deploy tourism prediction application",
          )

          print(f"Deployment uploaded to {repo_id}")
          PY
